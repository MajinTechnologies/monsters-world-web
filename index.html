<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Monsters World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e2e; }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container canvas {
      max-width: 100%;
      max-height: 100%;
    }
    #ui-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: center;
    }
    #ui-container > * {
      pointer-events: auto;
    }
    #ui-inner {
      width: 100%;
      max-width: 480px;
      height: 100%;
      position: relative;
    }
  </style>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="game-container"></div>
  <div id="ui-container">
    <div id="ui-inner"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
