<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Monsters World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1e1e2e; }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container canvas {
      max-width: 100%;
      max-height: 100%;
    }
    #ui-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: center;
    }
    #ui-container > * {
      pointer-events: auto;
    }
    #ui-inner {
      width: 100%;
      max-width: 480px;
      height: 100%;
      position: relative;
    }
  </style>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="game-container"></div>
  <div id="ui-container">
    <div id="ui-inner"></div>
  </div>

  <!-- ===== BATTLE EXIT MODAL ===== -->
  <div id="battle-exit-modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center" style="background:rgba(0,0,0,0.8);">
    <div class="modal-glow absolute inset-0 pointer-events-none"></div>
    <div class="relative z-10 bg-[#1e1e2e] border-2 border-white/10 rounded-2xl p-6 mx-6 flex flex-col items-center gap-4 max-w-sm w-full">
      <h2 class="text-xl font-extrabold text-white">¿Rendirse?</h2>
      <div class="flex gap-3 w-full">
        <button id="battle-exit-continue" class="flex-1 py-3 rounded-xl bg-green-500 text-white font-bold text-lg card-hover shadow-lg shadow-green-500/30">Seguir Luchando</button>
        <button id="battle-exit-abandon" class="flex-1 py-3 rounded-xl bg-red-500 text-white font-bold text-lg card-hover shadow-lg shadow-red-500/30">Abandonar</button>
      </div>
    </div>
  </div>

  <!-- ===== VICTORY MODAL ===== -->
  <div id="battle-victory-modal" class="hidden fixed inset-0 z-[200] flex items-center justify-center" style="background:rgba(0,0,0,0.8);">
    <div class="modal-glow absolute inset-0 pointer-events-none"></div>
    <div class="relative z-10 bg-[#1e1e2e] border-2 border-white/10 rounded-2xl p-6 mx-6 flex flex-col items-center gap-4 max-w-sm w-full">
      <h2 class="text-3xl font-extrabold text-game-orange">Victoria</h2>
      <p class="text-white text-center">¡Felicitaciones!</p>
      <p class="text-xs text-gray-400 text-center">Recordá que esto es una demo técnica, muy pronto habrá más novedades</p>
      <div class="flex gap-3 w-full">
        <button id="battle-victory-replay" class="flex-1 py-3 rounded-xl bg-green-500 text-white font-bold text-lg card-hover shadow-lg shadow-green-500/30">Repetir</button>
        <button id="battle-victory-exit" class="flex-1 py-3 rounded-xl bg-red-500 text-white font-bold text-lg card-hover shadow-lg shadow-red-500/30">Salir</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
